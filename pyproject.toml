[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-telemetry"
version = "0.1.0"
description = "Zero-dependency pure-Python protobuf decoder and read-only telemetry engine for Google Antigravity."
readme = "antigravity_telemetry/README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
authors = [
    { name = "Eneas", email = "eneasf@users.noreply.github.com" }
]
keywords = ["antigravity", "gemini", "telemetry", "tokens", "protobuf", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
antigravity-telemetry = "antigravity_telemetry.__main__:main"

[tool.setuptools.packages.find]
include = ["antigravity_telemetry*"]

[tool.setuptools.package-data]
antigravity_telemetry = ["*.json", "*.md"]
